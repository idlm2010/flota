<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlotaControl — Gestión de vehículos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --bg2: #161616;
  --bg3: #1e1e1e;
  --bg4: #272727;
  --border: #2e2e2e;
  --border2: #3a3a3a;
  --text: #f0ede8;
  --text2: #9a9490;
  --text3: #5a5755;
  --accent: #e8c547;
  --accent2: #f5d96b;
  --accent-bg: rgba(232,197,71,0.08);
  --red: #e85447;
  --green: #4caf7d;
  --blue: #5b9bd5;
  --orange: #e8904a;
  --radius: 10px;
  --radius-lg: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}
h1,h2,h3,h4 { font-family: 'Syne', sans-serif; font-weight: 700; }

/* NAV */
#topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px; height: 56px;
}
#topbar h1 { font-size: 18px; color: var(--accent); letter-spacing: -0.5px; flex-shrink:0; }
#topbar .tagline { font-size: 11px; color: var(--text3); font-style: italic; }
#topbar .spacer { flex:1; }
#google-btn {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); padding: 7px 16px; border-radius: 8px;
  cursor: pointer; font-family: 'DM Sans'; font-size: 13px;
  display: flex; align-items: center; gap: 8px;
  transition: border-color 0.2s, background 0.2s;
}
#google-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
#google-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink:0; }
#google-btn.connected .dot { background: var(--green); }

/* LAYOUT */
#app { display: flex; height: calc(100vh - 56px); }
#sidebar {
  width: 240px; flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
#main { flex: 1; overflow-y: auto; }

/* SIDEBAR */
.sidebar-section { padding: 16px 12px 8px; }
.sidebar-section .label {
  font-size: 10px; font-weight: 600; letter-spacing: 1.5px;
  color: var(--text3); text-transform: uppercase; margin-bottom: 6px;
}
.nav-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 8px;
  cursor: pointer; width: 100%; text-align: left;
  background: none; border: none; color: var(--text2);
  font-family: 'DM Sans'; font-size: 13px;
  transition: background 0.15s, color 0.15s;
}
.nav-btn:hover { background: var(--bg3); color: var(--text); }
.nav-btn.active { background: var(--accent-bg); color: var(--accent); }
.nav-btn .icon { font-size: 15px; width: 20px; text-align: center; }

.vehicle-card {
  margin: 4px 12px;
  padding: 10px 12px;
  background: var(--bg3); border-radius: 8px;
  cursor: pointer; border: 1px solid transparent;
  transition: border-color 0.15s;
}
.vehicle-card:hover { border-color: var(--border2); }
.vehicle-card.active { border-color: var(--accent); background: var(--accent-bg); }
.vehicle-card .vc-name { font-size: 13px; font-weight: 500; color: var(--text); }
.vehicle-card .vc-plate {
  font-size: 11px; color: var(--text3);
  font-family: 'Syne'; letter-spacing: 1px;
}
.vehicle-card .vc-status {
  display: inline-block; font-size: 10px; padding: 2px 7px;
  border-radius: 20px; margin-top: 4px; font-weight: 500;
}
.vc-status.activo { background: rgba(76,175,125,0.15); color: var(--green); }
.vc-status.vendido { background: rgba(232,84,71,0.15); color: var(--red); }

.sidebar-add-btn {
  margin: 8px 12px 16px;
  width: calc(100% - 24px);
  padding: 9px; border-radius: 8px;
  background: var(--accent); color: #0f0f0f;
  border: none; cursor: pointer;
  font-family: 'Syne'; font-size: 13px; font-weight: 700;
  transition: background 0.15s;
}
.sidebar-add-btn:hover { background: var(--accent2); }

/* MAIN CONTENT */
.page-header {
  padding: 28px 28px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
}
.page-header h2 { font-size: 22px; }
.page-header .subtitle { color: var(--text2); font-size: 13px; margin-top: 2px; }
.btn {
  padding: 8px 18px; border-radius: 8px;
  cursor: pointer; font-family: 'DM Sans'; font-size: 13px;
  border: 1px solid var(--border2); background: var(--bg3); color: var(--text);
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.btn:hover { border-color: var(--border2); background: var(--bg4); }
.btn.primary { background: var(--accent); color: #0f0f0f; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }
.btn.danger { color: var(--red); border-color: rgba(232,84,71,0.3); }
.btn.danger:hover { background: rgba(232,84,71,0.1); }
.btn.small { padding: 5px 12px; font-size: 12px; }

/* SECTIONS */
.content-body { padding: 24px 28px; }
.section-block {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 20px;
  overflow: hidden;
}
.section-block .sb-header {
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
.sb-header h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sb-header .sb-icon { color: var(--accent); }
.sb-body { padding: 20px; }

/* GRIDS INFO */
.info-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.info-item .lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px; }
.info-item .val { font-size: 14px; color: var(--text); }
.info-item .val.mono { font-family: 'Syne'; letter-spacing: 1px; font-size: 15px; color: var(--accent); }

/* HISTORY TABLE */
.hist-table { width: 100%; border-collapse: collapse; }
.hist-table th {
  text-align: left; font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text3); padding: 0 12px 10px 0;
  font-weight: 500;
}
.hist-table td { padding: 10px 12px 10px 0; border-top: 1px solid var(--border); font-size: 13px; vertical-align: top; }
.hist-table tr:first-child td { border-top: none; }
.hist-table .amount { font-family: 'Syne'; color: var(--accent); }
.hist-table .date { color: var(--text2); font-size: 12px; }
.hist-table .desc { color: var(--text2); font-size: 12px; }
.hist-table .expand-row td { background: var(--bg3); border-radius: var(--radius); }

/* BADGES */
.badge {
  display: inline-flex; align-items: center;
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  font-weight: 500; white-space: nowrap;
}
.badge.info { background: rgba(91,155,213,0.15); color: var(--blue); }
.badge.warn { background: rgba(232,144,74,0.15); color: var(--orange); }
.badge.ok { background: rgba(76,175,125,0.15); color: var(--green); }
.badge.danger { background: rgba(232,84,71,0.15); color: var(--red); }

/* MODAL */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 500;
  align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto;
}
#modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); width: 100%; max-width: 620px;
  flex-shrink: 0;
}
.modal-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: 18px; }
.modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 20px; line-height: 1; padding: 0; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* FORM */
.form-row { display: grid; gap: 14px; margin-bottom: 14px; }
.form-row.cols-2 { grid-template-columns: 1fr 1fr; }
.form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text3); font-weight: 500; }
.form-group input, .form-group select, .form-group textarea {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); padding: 9px 12px; border-radius: 8px;
  font-family: 'DM Sans'; font-size: 13px;
  transition: border-color 0.15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--accent);
}
.form-group textarea { resize: vertical; min-height: 70px; }
.form-group select option { background: var(--bg3); }
.form-sep { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

/* SUBDETAILS in taller */
.sub-items { margin-top: 12px; }
.sub-item {
  display: grid; grid-template-columns: 1fr 80px 100px 32px;
  gap: 8px; align-items: center; margin-bottom: 8px;
}
.sub-item input { width: 100%; }
.sub-item-header { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; display: grid; grid-template-columns: 1fr 80px 100px 32px; gap: 8px; }
.add-sub-btn { background: none; border: 1px dashed var(--border2); color: var(--text3); padding: 7px; border-radius: 6px; cursor: pointer; font-size: 12px; width: 100%; transition: all 0.15s; }
.add-sub-btn:hover { border-color: var(--accent); color: var(--accent); }
.del-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }
.del-btn:hover { color: var(--red); }

/* SEARCH PAGE */
.search-box {
  display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
}
.search-box input { flex:1; min-width: 200px; }
.search-results { display: flex; flex-direction: column; gap: 12px; }
.result-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
}
.result-card .rc-header {
  padding: 12px 20px; background: var(--bg3);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.rc-header .rc-concept { font-weight: 600; font-size: 15px; color: var(--accent); }
.rc-body { padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }

/* DASHBOARD */
.dash-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
.stat-card .sc-val { font-family: 'Syne'; font-size: 26px; color: var(--accent); font-weight: 700; }
.stat-card .sc-lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 4px; }

/* WELCOME */
#welcome-screen {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: calc(100vh - 56px); text-align: center; padding: 40px 20px;
}
#welcome-screen h2 { font-size: 32px; margin-bottom: 10px; }
#welcome-screen p { color: var(--text2); max-width: 420px; line-height: 1.7; margin-bottom: 24px; }

/* ITV warning */
.itv-warning { background: rgba(232,144,74,0.08); border: 1px solid rgba(232,144,74,0.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--orange); margin-bottom: 12px; }

/* Empty states */
.empty { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty .em-icon { font-size: 32px; margin-bottom: 12px; }
.empty p { font-size: 13px; }

/* responsive */
@media (max-width: 640px) {
  #sidebar { width: 200px; }
  .form-row.cols-2, .form-row.cols-3 { grid-template-columns: 1fr; }
  .page-header { flex-direction: column; }
  .content-body { padding: 16px; }
}
@media (max-width: 480px) {
  #sidebar { display: none; }
  #app { flex-direction: column; }
}
</style>
</head>
<body>

<div id="topbar">
  <h1>⚙ FlotaControl</h1>
  <span class="tagline">gestión de vehículos</span>
  <div class="spacer"></div>
  <button id="google-btn" onclick="handleAuth()">
    <span class="dot"></span>
    <span id="auth-label">Conectar Google Drive</span>
  </button>
  <button id="reset-btn" title="Cambiar Client ID o desconectar" onclick="resetClientId()"
    style="background:none;border:1px solid var(--border);color:var(--text3);cursor:pointer;font-size:11px;padding:5px 9px;border-radius:6px;display:none;font-family:'DM Sans'">⚙ Config</button>
</div>

<div id="app">
  <nav id="sidebar">
    <div class="sidebar-section">
      <div class="label">General</div>
      <button class="nav-btn active" onclick="showPage('dashboard')" id="nav-dashboard">
        <span class="icon">◈</span> Panel general
      </button>
      <button class="nav-btn" onclick="showPage('buscar')" id="nav-buscar">
        <span class="icon">◎</span> Buscar en taller
      </button>
    </div>
    <div class="sidebar-section">
      <div class="label">Vehículos</div>
    </div>
    <div id="vehicle-list"></div>
    <div style="padding: 0 12px 16px;">
      <button class="sidebar-add-btn" onclick="openModal('vehiculo')">+ Añadir vehículo</button>
    </div>
  </nav>

  <main id="main">
    <div id="page-dashboard"></div>
    <div id="page-vehiculo" style="display:none"></div>
    <div id="page-buscar" style="display:none"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Formulario</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="saveModal()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ================================================================
// DATA LAYER
// ================================================================
const CLIENT_ID = localStorage.getItem('gc_client_id') || '';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/drive.file';
const FILE_NAME = 'flota_vehiculos_v1.json';

let tokenClient = null;
let accessToken = null;
let driveFileId = null;
let data = { vehicles: [] };
let currentVehicleId = null;
let modalType = null;
let editId = null;
let subItems = [];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function fmt(v) { return v !== undefined && v !== null && v !== '' ? v : '—'; }
function fmtDate(d) { if (!d) return '—'; try { return new Date(d + 'T12:00:00').toLocaleDateString('es-ES'); } catch(e){ return d; } }
function fmtMoney(v) { if (!v && v !== 0) return '—'; return Number(v).toLocaleString('es-ES', {style:'currency',currency:'EUR'}); }
function fmtKm(v) { if (!v && v !== 0) return '—'; return Number(v).toLocaleString('es-ES') + ' km'; }

// ================================================================
// GOOGLE AUTH
// ================================================================
function initGapi() {
  const cid = localStorage.getItem('gc_client_id');
  if (!cid) return;
  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: SCOPES,
      ux_mode: 'popup',
      callback: async (resp) => {
        if (resp.error) {
          console.error('OAuth error:', resp);
          alert('Error de autenticación: ' + (resp.error_description || resp.error) +
            '\n\nAsegúrate de que en Google Cloud Console:\n' +
            '1. La API de Google Drive está activada\n' +
            '2. En "Orígenes JS autorizados" has añadido: ' + location.origin + '\n' +
            '3. La pantalla de consentimiento OAuth está configurada');
          return;
        }
        accessToken = resp.access_token;
        localStorage.setItem('gc_token_exp', Date.now() + 3500000);
        document.getElementById('google-btn').classList.add('connected');
        document.getElementById('auth-label').textContent = 'Drive conectado ✓';
        await loadData();
      }
    });
  } catch(e) {
    console.error('initTokenClient error:', e);
  }
}

function handleAuth() {
  if (accessToken) {
    saveData().then(() => {
      const lbl = document.getElementById('auth-label');
      lbl.textContent = '¡Guardado!';
      setTimeout(() => lbl.textContent = 'Drive conectado ✓', 1500);
    });
    return;
  }
  const cid = localStorage.getItem('gc_client_id');
  if (!cid) {
    showClientIdDialog();
    return;
  }
  if (!tokenClient) { initGapi(); }
  if (!tokenClient) { alert('Error cargando Google Identity Services. Recarga la página.'); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function showClientIdDialog() {
  const origin = location.origin;
  const msg = `Para conectar con Google Drive necesitas un Client ID OAuth 2.0.

Pasos (5 minutos, gratis):
1. Ve a: https://console.cloud.google.com
2. Crea un proyecto → "APIs y servicios" → "Biblioteca"
   → Activa "Google Drive API"
3. "Credenciales" → "Crear credenciales" → "ID cliente OAuth 2.0"
   → Tipo: Aplicación web
   → Origen JS autorizado: ${origin}
4. Copia el Client ID (termina en .apps.googleusercontent.com)
5. También configura la "Pantalla de consentimiento OAuth"
   → Tipo: Externo → añade tu email como usuario de prueba

Pega aquí tu Client ID:`;
  const id = prompt(msg);
  if (!id) return;
  if (!id.trim().includes('.apps.googleusercontent.com')) {
    alert('El Client ID no parece válido. Debe terminar en .apps.googleusercontent.com');
    return;
  }
  localStorage.setItem('gc_client_id', id.trim());
  location.reload();
}

async function driveRequest(method, url, body, contentType) {
  const res = await fetch(url, {
    method,
    headers: {
      'Authorization': 'Bearer ' + accessToken,
      ...(contentType ? { 'Content-Type': contentType } : {})
    },
    body: body ? (typeof body === 'string' ? body : JSON.stringify(body)) : undefined
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function findOrCreateFile() {
  const list = await driveRequest('GET',
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${FILE_NAME}'&fields=files(id,name)`);
  if (list.files && list.files.length > 0) {
    driveFileId = list.files[0].id;
    return true;
  }
  return false;
}

async function loadData() {
  try {
    const found = await findOrCreateFile();
    if (found) {
      const content = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });
      data = await content.json();
    } else {
      data = { vehicles: [] };
      await saveData();
    }
    renderAll();
  } catch(e) {
    alert('Error cargando datos: ' + e.message);
    data = { vehicles: [] };
    renderAll();
  }
}

async function saveData() {
  if (!accessToken) return;
  const jsonStr = JSON.stringify(data);
  try {
    if (driveFileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: jsonStr
      });
    } else {
      const meta = await driveRequest('POST',
        'https://www.googleapis.com/drive/v3/files?fields=id',
        { name: FILE_NAME, parents: ['appDataFolder'] },
        'application/json');
      driveFileId = meta.id;
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: jsonStr
      });
    }
  } catch(e) {
    console.error('Error guardando:', e);
  }
}

// ================================================================
// RENDER
// ================================================================
function renderAll() {
  renderSidebar();
  showPage(document.querySelector('.nav-btn.active')?.id.replace('nav-','') || 'dashboard');
}

function renderSidebar() {
  const vl = document.getElementById('vehicle-list');
  vl.innerHTML = '';
  (data.vehicles || []).forEach(v => {
    const div = document.createElement('div');
    div.className = 'vehicle-card' + (v.id === currentVehicleId ? ' active' : '');
    div.innerHTML = `<div class="vc-name">${v.marca} ${v.modelo}</div>
      <div class="vc-plate">${v.matricula || '—'}</div>
      <span class="vc-status ${v.vendido ? 'vendido' : 'activo'}">${v.vendido ? 'Vendido' : 'Activo'}</span>`;
    div.onclick = () => { currentVehicleId = v.id; renderAll(); showPage('vehiculo'); };
    vl.appendChild(div);
  });
}

function showPage(p) {
  document.querySelectorAll('[id^="page-"]').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  const nb = document.getElementById('nav-' + p);
  if (nb) nb.classList.add('active');
  const pg = document.getElementById('page-' + p);
  if (!pg) { showPage('dashboard'); return; }
  pg.style.display = '';
  if (p === 'dashboard') renderDashboard();
  else if (p === 'vehiculo') renderVehiclePage();
  else if (p === 'buscar') renderBuscar();
}

// DASHBOARD
// ================================================================
function renderDashboard() {
  const pg = document.getElementById('page-dashboard');
  const veh = data.vehicles || [];
  const activos = veh.filter(v => !v.vendido).length;
  const totalGasto = veh.reduce((s, v) => {
    return s + (v.talleres || []).reduce((st, t) => st + (Number(t.importe) || 0), 0);
  }, 0);
  const totalCompra = veh.reduce((s, v) => s + (Number(v.importeCompra) || 0), 0);

  // ITV próximas (sin fecha de proxima ITV, advertir si la última fue hace más de 2 años)
  const now = new Date();
  const itvAlertas = veh.filter(v => {
    if (v.vendido) return false;
    const itvs = v.itvs || [];
    if (!itvs.length) return true;
    const last = itvs.sort((a,b) => new Date(b.fecha) - new Date(a.fecha))[0];
    const diff = (now - new Date(last.fecha + 'T12:00:00')) / (1000 * 60 * 60 * 24 * 365);
    return diff > 1.8;
  });

  let html = `<div class="page-header"><div><h2>Panel general</h2><div class="subtitle">Resumen de tu flota</div></div></div>
  <div class="content-body">`;

  if (!veh.length) {
    html += `<div class="empty"><div class="em-icon">🚗</div><p>No hay vehículos registrados.<br>Usa el botón <strong>+ Añadir vehículo</strong> para empezar.</p></div>`;
    html += `</div>`;
    pg.innerHTML = html;
    return;
  }

  html += `<div class="dash-stats">
    <div class="stat-card"><div class="sc-val">${activos}</div><div class="sc-lbl">Vehículos activos</div></div>
    <div class="stat-card"><div class="sc-val">${veh.length}</div><div class="sc-lbl">Total registrados</div></div>
    <div class="stat-card"><div class="sc-val">${totalGasto.toLocaleString('es-ES', {style:'currency',currency:'EUR'})}</div><div class="sc-lbl">Gasto total taller</div></div>
    <div class="stat-card"><div class="sc-val">${totalCompra.toLocaleString('es-ES', {style:'currency',currency:'EUR'})}</div><div class="sc-lbl">Inversión total</div></div>
  </div>`;

  if (itvAlertas.length) {
    itvAlertas.forEach(v => {
      const itvs = v.itvs || [];
      const last = itvs.length ? itvs.sort((a,b) => new Date(b.fecha) - new Date(a.fecha))[0] : null;
      html += `<div class="itv-warning">⚠ <strong>${v.marca} ${v.modelo}</strong> (${v.matricula || '—'}) — ${last ? 'Última ITV: ' + fmtDate(last.fecha) : 'Sin ITV registrada'}. Revisa si necesita pasar ITV.</div>`;
    });
  }

  html += `<div class="section-block"><div class="sb-header"><h3><span class="sb-icon">◈</span> Todos los vehículos</h3></div><div class="sb-body">
    <table class="hist-table"><thead><tr>
      <th>Vehículo</th><th>Matrícula</th><th>Tipo</th><th>Compra</th><th>Gasto taller</th><th>Estado</th>
    </tr></thead><tbody>`;
  veh.forEach(v => {
    const gt = (v.talleres || []).reduce((s,t) => s + (Number(t.importe)||0), 0);
    html += `<tr style="cursor:pointer" onclick="currentVehicleId='${v.id}';renderAll();showPage('vehiculo')">
      <td><strong>${v.marca} ${v.modelo}</strong></td>
      <td style="font-family:'Syne';letter-spacing:1px;color:var(--accent)">${fmt(v.matricula)}</td>
      <td><span class="badge info">${fmt(v.tipo)}</span></td>
      <td>${fmtMoney(v.importeCompra)}</td>
      <td>${fmtMoney(gt)}</td>
      <td><span class="badge ${v.vendido?'danger':'ok'}">${v.vendido?'Vendido':'Activo'}</span></td>
    </tr>`;
  });
  html += `</tbody></table></div></div></div>`;
  pg.innerHTML = html;
}

  </div></div>`;

  // VENTA
  if (v.vendido) {
    html += `<div class="section-block"><div class="sb-header"><h3><span class="sb-icon">◉</span> Venta</h3></div><div class="sb-body">
      <div class="info-grid">
        <div class="info-item"><div class="lbl">Fecha venta</div><div class="val">${fmtDate(v.fechaVenta)}</div></div>
        <div class="info-item"><div class="lbl">KM a la venta</div><div class="val">${fmtKm(v.kmVenta)}</div></div>

function renderSeguro(v) {
  const s = v.seguro || {};
  const hasSeguro = s.compania || s.poliza;
  let html = `<div class="section-block"><div class="sb-header"><h3><span class="sb-icon">◉</span> Seguro</h3>
    <button class="btn small" onclick="openModal('seguro','${v.id}')">✎ ${hasSeguro ? 'Editar' : 'Añadir'}</button>
  </div><div class="sb-body">`;
  if (!hasSeguro) {
    html += `<div class="empty" style="padding:20px 0"><p>Sin seguro registrado</p></div>`;
  } else {
    const exp = s.vencimiento ? new Date(s.vencimiento + 'T12:00:00') : null;
    const daysLeft = exp ? Math.round((exp - new Date()) / (1000*60*60*24)) : null;
    html += `<div class="info-grid">
      <div class="info-item"><div class="lbl">Compañía</div><div class="val">${fmt(s.compania)}</div></div>
      <div class="info-item"><div class="lbl">Póliza</div><div class="val">${fmt(s.poliza)}</div></div>
      <div class="info-item"><div class="lbl">Vencimiento</div><div class="val">${fmtDate(s.vencimiento)}${daysLeft !== null ? ` <span class="badge ${daysLeft < 30 ? 'danger' : daysLeft < 90 ? 'warn' : 'ok'}">${daysLeft < 0 ? 'Vencido' : daysLeft + 'd'}</span>` : ''}</div></div>
      <div class="info-item"><div class="lbl">Importe</div><div class="val">${fmtMoney(s.importe)}</div></div>
    </div>
    ${s.descripcion ? `<div style="margin-top:12px;padding:12px;background:var(--bg3);border-radius:8px;font-size:13px;color:var(--text2)">${s.descripcion}</div>` : ''}`;
  }
  html += `</div></div>`;
  return html;
}

function renderTalleres(v) {
  const ts = (v.talleres || []).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
  let html = `<div class="section-block"><div class="sb-header"><h3><span class="sb-icon">◈</span> Historial de taller</h3>
    <button class="btn small" onclick="openModal('taller','${v.id}')">+ Añadir</button>
  </div><div class="sb-body">`;
  if (!ts.length) {
    html += `<div class="empty" style="padding:20px 0"><p>Sin entradas de taller</p></div>`;
  } else {
    html += `<table class="hist-table"><thead><tr>
      <th>Fecha</th><th>Taller</th><th>KM</th><th>Importe</th><th>Descripción</th><th></th>
    </tr></thead><tbody>`;
    ts.forEach(t => {
      const detHtml = (t.items||[]).map(it => `<div style="display:flex;gap:12px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)">
        <span style="flex:1">${it.concepto}</span>
        <span style="color:var(--text3)">${it.cantidad}</span>
        <span style="color:var(--accent);font-family:'Syne'">${fmtMoney(it.importe)}</span>
      </div>`).join('');
      html += `<tr>
        <td class="date">${fmtDate(t.fecha)}</td>
        <td>${fmt(t.taller)}</td>
        <td>${fmtKm(t.km)}</td>
        <td class="amount">${fmtMoney(t.importe)}</td>
        <td class="desc">${fmt(t.descripcion)}</td>
        <td style="white-space:nowrap">
          <button class="btn small" onclick="openModal('taller','${v.id}','${t.id}')">✎</button>
          <button class="btn small danger" onclick="deleteItem('talleres','${v.id}','${t.id}')">✕</button>

  }
  html += `</div></div>`;
  return html;
}

function doSearch() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
  const res = document.getElementById('search-results');
  if (!q) { res.innerHTML = `<div class="empty"><p>Escribe para buscar</p></div>`; return; }

  const found = [];
  (data.vehicles || []).forEach(v => {
    (v.talleres || []).forEach(t => {
      (t.items || []).forEach(it => {
        if ((it.concepto || '').toLowerCase().includes(q)) {
          found.push({ v, t, it });
        }
      });
    });
  });

  if (!found.length) { res.innerHTML = `<div class="empty"><p>Sin resultados para "<strong>${q}</strong>"</p></div>`; return; }

  res.innerHTML = found.map(({v,t,it}) => `
    <div class="result-card">
      <div class="rc-header">
        <span class="rc-concept">${it.concepto}</span>
        <span class="badge info">${v.marca} ${v.modelo}</span>
        <span style="font-family:'Syne';letter-spacing:1px;font-size:11px;color:var(--text3)">${v.matricula||''}</span>
      </div>
      <div class="rc-body">
        <div class="info-item"><div class="lbl">Fecha</div><div class="val">${fmtDate(t.fecha)}</div></div>
        <div class="info-item"><div class="lbl">Taller</div><div class="val">${fmt(t.taller)}</div></div>
        <div class="info-item"><div class="lbl">KM entonces</div><div class="val">${fmtKm(t.km)}</div></div>
        <div class="info-item"><div class="lbl">Precio concepto</div><div class="val" style="color:var(--accent)">${fmtMoney(it.importe)}</div></div>
        <div class="info-item"><div class="lbl">Factura total</div><div class="val" style="color:var(--accent)">${fmtMoney(t.importe)}</div></div>
        <div class="info-item"><div class="lbl">Cantidad</div><div class="val">${fmt(it.cantidad)}</div></div>
      </div>
    </div>`).join('');
}

// ================================================================
// MODALS
// ================================================================
function openModal(type, vehicleId, itemId) {
  modalType = type; editId = itemId || null;
  if (vehicleId) currentVehicleId = vehicleId;
  const v = (data.vehicles||[]).find(x => x.id === currentVehicleId);

  const overlay = document.getElementById('modal-overlay');
  const body = document.getElementById('modal-body');
  const title = document.getElementById('modal-title');
  subItems = [];

  if (type === 'vehiculo') {
    title.textContent = editId ? 'Editar vehículo' : 'Nuevo vehículo';
    const ev = editId ? (data.vehicles||[]).find(x => x.id === editId) : {};
    body.innerHTML = buildVehiculoForm(ev || {});
  } else if (type === 'venta') {
    title.textContent = 'Registrar venta';
    const ev = v || {};
    body.innerHTML = buildVentaForm(ev);
  } else if (type === 'seguro') {
    title.textContent = 'Seguro del vehículo';
    body.innerHTML = buildSeguroForm(v?.seguro || {});
  } else if (type === 'taller') {
    title.textContent = editId ? 'Editar entrada taller' : 'Nueva entrada taller';
    const et = editId ? (v?.talleres||[]).find(x => x.id === editId) : {};
    subItems = (et?.items || []).map(i => ({...i}));
    body.innerHTML = buildTallerForm(et || {});
    renderSubItems();
  } else if (type === 'itv') {
    title.textContent = editId ? 'Editar ITV' : 'Nueva ITV';
    const et = editId ? (v?.itvs||[]).find(x => x.id === editId) : {};
    body.innerHTML = buildITVForm(et || {});
  } else if (type === 'historial') {
    title.textContent = editId ? 'Editar anotación' : 'Nueva anotación';
    const et = editId ? (v?.historial||[]).find(x => x.id === editId) : {};
    body.innerHTML = buildHistorialForm(et || {});
  }

  overlay.classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  modalType = null; editId = null; subItems = [];
}

function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

function saveModal() {
  const v = (data.vehicles||[]).find(x => x.id === currentVehicleId);

  if (modalType === 'vehiculo') {
    const obj = {
      id: editId || uid(), tipo: val('v-tipo'), marca: val('v-marca'), modelo: val('v-modelo'),
      matricula: val('v-matricula'), motor: val('v-motor'), potencia: val('v-potencia'),
      fechaCompra: val('v-fechaCompra'), kmCompra: val('v-kmCompra'), importeCompra: val('v-importeCompra'),
      vendedor: val('v-vendedor'), notasCompra: val('v-notasCompra'),
      talleres: [], itvs: [], historial: [], seguro: {}
    };
    if (!obj.marca) { alert('La marca es obligatoria'); return; }
    if (editId) {
      const idx = data.vehicles.findIndex(x => x.id === editId);
      if (idx >= 0) {
        obj.talleres = data.vehicles[idx].talleres || [];
        obj.itvs = data.vehicles[idx].itvs || [];
        obj.historial = data.vehicles[idx].historial || [];
        obj.seguro = data.vehicles[idx].seguro || {};
        obj.vendido = data.vehicles[idx].vendido;
        obj.fechaVenta = data.vehicles[idx].fechaVenta;
        obj.kmVenta = data.vehicles[idx].kmVenta;
        obj.comprador = data.vehicles[idx].comprador;
        obj.notasVenta = data.vehicles[idx].notasVenta;
        data.vehicles[idx] = obj;
      }
    } else {
      if (!data.vehicles) data.vehicles = [];
      data.vehicles.push(obj);
      currentVehicleId = obj.id;
    }
  } else if (modalType === 'venta' && v) {
    v.vendido = true;
    v.fechaVenta = val('vt-fecha');
    v.kmVenta = val('vt-km');
    v.comprador = val('vt-comprador');
    v.notasVenta = val('vt-notas');
  } else if (modalType === 'seguro' && v) {
    v.seguro = { compania: val('s-compania'), poliza: val('s-poliza'), vencimiento: val('s-vencimiento'), importe: val('s-importe'), descripcion: val('s-descripcion') };
  } else if (modalType === 'taller' && v) {
    if (!v.talleres) v.talleres = [];
    const obj = { id: editId || uid(), fecha: val('t-fecha'), taller: val('t-taller'), km: val('t-km'), importe: val('t-importe'), descripcion: val('t-descripcion'), items: subItems.filter(i => i.concepto) };
    if (editId) { const idx = v.talleres.findIndex(x => x.id === editId); if (idx >= 0) v.talleres[idx] = obj; }
    else v.talleres.push(obj);
  } else if (modalType === 'itv' && v) {
    if (!v.itvs) v.itvs = [];
    const obj = { id: editId || uid(), fecha: val('i-fecha'), lugar: val('i-lugar'), km: val('i-km'), observaciones: val('i-obs') };
    if (editId) { const idx = v.itvs.findIndex(x => x.id === editId); if (idx >= 0) v.itvs[idx] = obj; }
    else v.itvs.push(obj);
  } else if (modalType === 'historial' && v) {
    if (!v.historial) v.historial = [];
    const obj = { id: editId || uid(), fecha: val('h-fecha'), nota: val('h-nota') };
    if (editId) { const idx = v.historial.findIndex(x => x.id === editId); if (idx >= 0) v.historial[idx] = obj; }
    else v.historial.push(obj);
  }

  saveData();
  closeModal();
  renderAll();
  if (modalType !== 'vehiculo' || editId) showPage('vehiculo');
  else showPage('vehiculo');
}

function deleteVehicle(id) {
  if (!confirm('¿Eliminar este vehículo y todos sus datos?')) return;
  data.vehicles = (data.vehicles||[]).filter(x => x.id !== id);
  currentVehicleId = null;
  saveData();
  renderAll();
  showPage('dashboard');
}

function deleteItem(collection, vehicleId, itemId) {
  if (!confirm('¿Eliminar esta entrada?')) return;
  const v = (data.vehicles||[]).find(x => x.id === vehicleId);
  if (!v) return;
  v[collection] = (v[collection]||[]).filter(x => x.id !== itemId);
  saveData();
  renderAll();
  showPage('vehiculo');
}

function addSubItem() {
  subItems.push({ id: uid(), concepto: '', cantidad: 1, importe: '' });
  renderSubItems();
}

function removeSubItem(idx) {
  subItems.splice(idx, 1);
  renderSubItems();
}

function renderSubItems() {
  const c = document.getElementById('sub-items-container');
  if (!c) return;
  if (!subItems.length) { c.innerHTML = ''; return; }
  let html = `<div class="sub-item-header"><span>Concepto</span><span>Cantidad</span><span>Importe (€)</span><span></span></div>`;
  subItems.forEach((it, i) => {
    html += `<div class="sub-item">
      <input type="text" value="${it.concepto||''}" placeholder="Concepto…" oninput="subItems[${i}].concepto=this.value">
      <input type="number" value="${it.cantidad||1}" min="0.01" step="any" oninput="subItems[${i}].cantidad=this.value">
      <input type="number" value="${it.importe||''}" step="0.01" placeholder="0.00" oninput="subItems[${i}].importe=this.value">
      <button class="del-btn" onclick="removeSubItem(${i})">✕</button>
    </div>`;
  });
  c.innerHTML = html;
}

function resetClientId() {
  if (confirm('¿Cambiar el Client ID de Google o desconectar?\n\nEsto borrará el Client ID guardado y recargará la página.')) {
    localStorage.removeItem('gc_client_id');
    localStorage.removeItem('gc_token_exp');
    accessToken = null;
    location.reload();
  }
}

// ================================================================
// INIT
// ================================================================
window.onload = function() {
  // Load GAPI
  const cid = localStorage.getItem('gc_client_id');
  if (cid) {
    // Show reset button
    setTimeout(() => {
      const rb = document.getElementById('reset-btn');
      if (rb) rb.style.display = 'inline-block';
    }, 100);
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = () => {
      initGapi();
      // Auto-reconnect if token not expired
      const exp = localStorage.getItem('gc_token_exp');
      if (exp && Date.now() < Number(exp) && tokenClient) {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    };
    s.onerror = () => console.error('No se pudo cargar Google Identity Services');
    document.head.appendChild(s);
  }

  // Load local data for offline preview
  const local = localStorage.getItem('flota_local_data');
  if (local) { try { data = JSON.parse(local); } catch(e) {} }

  renderAll();
  showPage('dashboard');

  // Auto-save to localStorage as backup
  setInterval(() => {
    try { localStorage.setItem('flota_local_data', JSON.stringify(data)); } catch(e) {}
  }, 5000);
};

// Save to localStorage on unload
window.addEventListener('beforeunload', () => {
  try { localStorage.setItem('flota_local_data', JSON.stringify(data)); } catch(e) {}
});
</script>

<!-- Google Identity Services cargado solo si hay client ID -->
